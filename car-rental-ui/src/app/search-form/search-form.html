<form [formGroup]="form" (ngSubmit)="submit()" class="search-form" aria-label="Search rental cars">
  <div class="field">
    <label for="pickup">Pickup location</label>
    <select id="pickup" formControlName="pickup">
      <option value="" disabled>Select a city…</option>
      @for (location of locations(); track location.name) {
        <option [value]="location.name">
          {{ location.name }} {{ location.isInternational ? '(international)' : '(domestic)' }}
        </option>
      }
    </select>
    @if (showRequired('pickup')) {
      <p class="field-error">Pickup location is required.</p>
    }
  </div>

  <div class="field">
    <label for="from">Pickup date</label>
    <input id="from" type="date" formControlName="from" />
    @if (showRequired('from')) {
      <p class="field-error">Pickup date is required.</p>
    }
  </div>

  <div class="field">
    <label for="to">Return date</label>
    <input id="to" type="date" formControlName="to" />
    @if (showRequired('to')) {
      <p class="field-error">Return date is required.</p>
    }
    @if (showDateRangeError) {
      <p class="field-error">Return date must be after the pickup date.</p>
    }
  </div>

  <div class="field">
    <label for="category">Category <span class="optional">(optional)</span></label>
    <select id="category" formControlName="category">
      <option value="">Any category</option>
      @for (category of categories; track category) {
        <option [value]="category">{{ categoryLabels[category] }}</option>
      }
    </select>
  </div>

  <button type="submit" class="primary" [disabled]="searching()">
    {{ searching() ? 'Searching…' : 'Search cars' }}
  </button>
</form>
